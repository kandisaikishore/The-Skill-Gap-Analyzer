name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Smoke test
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload static artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-gap-analyzer-dist
          path: dist/
          if-no-files-found: error
